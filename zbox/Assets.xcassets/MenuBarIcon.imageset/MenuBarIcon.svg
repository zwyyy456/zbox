<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- 顶部实心启动栏 + 负空间镂空指令槽 (使用 evenodd 实现纯路径镂空) -->
  <path fill="#000000" fill-rule="evenodd" d="
    M 4.2 2
    H 13.8
    A 2.4 2.4 0 0 1 16.2 4.4
    V 5.6
    A 2.4 2.4 0 0 1 13.8 8
    H 4.2
    A 2.4 2.4 0 0 1 1.8 5.6
    V 4.4
    A 2.4 2.4 0 0 1 4.2 2 Z
    M 4.4 3.7
    A 0.8 0.8 0 0 0 3.6 4.5
    V 5.5
    A 0.8 0.8 0 0 0 4.4 6.3
    H 5.6
    A 0.8 0.8 0 0 0 6.4 5.5
    V 4.5
    A 0.8 0.8 0 0 0 5.6 3.7
    H 4.4 Z
    M 8.2 4.35
    A 0.65 0.65 0 0 0 7.55 5
    A 0.65 0.65 0 0 0 8.2 5.65
    H 13.2
    A 0.65 0.65 0 0 0 13.85 5
    A 0.65 0.65 0 0 0 13.2 4.35
    H 8.2 Z
  " />

  <!-- 左下模块：半实心/实心岩石块（呼应主图标深灰模块） -->
  <rect x="1.8" y="10" width="6.2" height="6" rx="2" fill="#000000" />

  <!-- 右下模块：粗描边空心块（呼应主图标暖黄高亮模块与圆环） -->
  <rect x="10.6" y="10.8" width="4.6" height="4.4" rx="1.5" fill="none" stroke="#000000" stroke-width="1.6" />
</svg>
